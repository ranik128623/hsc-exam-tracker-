<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-grad)" filter="url(#shadow)" />

  <!-- Outer Target Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.9" />
  <circle cx="256" cy="256" r="152" fill="#10b981" opacity="0.35" />

  <!-- Middle Contrast Ring -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="#ffffff" stroke-width="6" />
  <circle cx="256" cy="256" r="108" fill="#0f172a" opacity="0.85" />

  <!-- Inner Bullseye Ring -->
  <circle cx="256" cy="256" r="76" fill="none" stroke="#ffffff" stroke-width="5" />
  <circle cx="256" cy="256" r="64" fill="url(#gold-grad)" />
  <circle cx="256" cy="256" r="24" fill="#ffffff" />

  <!-- Precision Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="120" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="392" x2="256" y2="456" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="56" y1="256" x2="120" y2="256" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="392" y1="256" x2="456" y2="256" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

  <!-- Minute Tick Marks -->
  <circle cx="256" cy="92" r="4" fill="#34d399" />
  <circle cx="420" cy="256" r="4" fill="#34d399" />
  <circle cx="256" cy="420" r="4" fill="#34d399" />
  <circle cx="92" cy="256" r="4" fill="#34d399" />
</svg>
